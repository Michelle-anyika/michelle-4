<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Fruits of Love Family</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #cc3366, #ff6b9d);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-container {
      background: white;
      padding: clamp(1.5rem, 4vw, 2rem);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 1rem;
      background: #f0f0f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    h1 {
      color: #cc3366;
      margin-bottom: 0.5rem;
      font-size: clamp(1.3rem, 4vw, 1.5rem);
    }

    .subtitle {
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #333;
      font-weight: bold;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.8rem;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      transition: border-color 0.3s;
      box-sizing: border-box;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #cc3366;
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      background: #cc3366;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: clamp(1rem, 2.5vw, 1.1rem);
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login-btn:hover {
      background: #b02c5a;
    }

    .back-link {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #eee;
    }

    .back-link a {
      color: #cc3366;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 0.8rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      display: none;
    }
    
    @media (max-width: 480px) {
      .login-container {
        margin: 1rem;
        padding: 1.5rem;
      }
      
      .logo {
        width: 60px;
        height: 60px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">🔐</div>
    <h1>Admin Login</h1>
    <p class="subtitle">Fruits of Love Family Dashboard</p>
    
    <div class="error-message" id="errorMessage">
      Invalid username or password. Please try again.
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      
      <button type="submit" class="login-btn">Login to Dashboard</button>
    </form>

    <div class="back-link">
      <a href="index.html">← Back to Website</a>
    </div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      // Simple frontend validation (will be replaced with backend auth)
      if (username === 'admin' && password === 'fruitsoflove2024') {
        // Store login status (temporary - will use JWT later)
        localStorage.setItem('adminLoggedIn', 'true');
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('errorMessage').style.display = 'block';
        setTimeout(() => {
          document.getElementById('errorMessage').style.display = 'none';
        }, 3000);
      }
    }
  </script>
</body>
</html>
